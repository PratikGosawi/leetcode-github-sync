<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode Sync</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <div class="logo-glow"></div>
                <h1>LeetCode <span>Sync</span></h1>
            </div>
            <p class="subtitle">Auto-push solutions to GitHub</p>
        </header>

        <main>
            <form id="settings-form">
                <div class="input-group">
                    <label for="gh-token">GitHub Personal Access Token</label>
                    <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx" required autocomplete="off">
                    <small class="help-text">Needs 'repo' scope.</small>
                </div>

                <div class="input-group">
                    <label for="gh-repo">Repository Name</label>
                    <input type="text" id="gh-repo" placeholder="LeetCode-Solutions" required autocomplete="off">
                    <small class="help-text">Will be created if it doesn't exist.</small>
                </div>

                <button type="submit" id="save-btn">
                    <span class="btn-text">Connect & Save</span>
                    <div class="spinner hidden"></div>
                </button>
            </form>

            <div id="status-message" class="status hidden"></div>
        </main>

        <footer>
            <div class="status-indicator">
                <div class="dot" id="connection-dot"></div>
                <span id="connection-status">Not connected</span>
            </div>
        </footer>
    </div>
    <script src="popup.js" type="module"></script>
</body>
</html>
